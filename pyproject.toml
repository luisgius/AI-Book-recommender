# Deployment of the cloud profile on Vercel (V17). Local work does not use
# this file: it keeps requirements.txt (pip freeze of the full environment).
#
# Why a pyproject.toml: Vercel's Python builder looks for the dependency list
# in pyproject.toml first, then Pipfile, then requirements*.txt, so this file
# makes the deployed function install the slim cloud list instead of the full
# requirements.txt (torch, FAISS, sentence-transformers: several GB). The pins
# below are exactly those of requirements-cloud.txt, and
# tests/test_requirements_cloud.py fails if the two lists differ. Keep them in
# step: edit requirements-cloud.txt, then copy its pins here.
#
# vercel.json cannot hold comments; its settings are explained here:
# - "regions": ["fra1"]: Frankfurt, the region of the Neon database
#   (aws-eu-central-1), so each query to Postgres stays inside one city
#   (a Hobby project runs its functions in a single region).
# - "functions" -> "app/main.py" (the entrypoint file below):
#   - "maxDuration": 120 seconds, under the 300 s ceiling of the Hobby plan and
#     above the slowest legitimate request (a search with three LLM
#     explanations, each LLM call at most LLM_TIMEOUT_S=15 s with one retry,
#     plus at most 5 s for each model API call of the search).
#   - No "excludeFiles": .vercelignore is an allowlist, so only app/ (with
#     app/ui/static, the web UI), this file and vercel.json are uploaded; data,
#     tests, docs, evaluation outputs and local tooling never reach the bundle.
#   - Memory is not set: on the Hobby plan it is fixed (2 GB, 1 vCPU) and,
#     with Fluid compute, vercel.json cannot set it.
# - "git": {"deploymentEnabled": false}: no deployment is triggered from a
#   Git push; the project is deployed from this directory with the CLI
#   (vercel deploy --prod), so what is published is always a deliberate step.

[project]
name = "ai-book-recommender"
version = "1.0.0"
description = "Hybrid book search and recommendation (BM25 + embeddings + LLM), cloud profile"
# Python 3.13, the version of the local environment and of the tests.
requires-python = ">=3.13,<3.14"
dependencies = [
